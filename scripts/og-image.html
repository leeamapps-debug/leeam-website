<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Open Graph image source</title>
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../fonts/SpaceGrotesk-variable.woff2") format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #FFFFFF; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; font-family: "Space Grotesk", Arial, sans-serif; }
  img { width: 460px; height: auto; }
  p { margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; color: #111111; }
  .rule { width: 110px; height: 12px; background: #FF6616; clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); }
</style>
</head>
<body>
  <img src="../images/leeam-logo-full.svg" alt="">
  <div class="rule"></div>
  <p>Apps that work for everyone.</p>
</body>
</html>
